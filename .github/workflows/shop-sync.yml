# Refreshes _data/shop.json (prices, what is on sale, bundles) from the Moonbase storefront every
# morning, or when started by hand, and commits it when it changed; GitHub Pages then rebuilds the site.
name: Shop sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shop-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot the storefront
        run: python3 scripts/sync-shop.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- _data/shop.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/shop.json
          git commit -m "Shop: prices from Moonbase"
          git push

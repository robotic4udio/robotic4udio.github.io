<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__mark" src="{{ '/assets/images/ra-mark.svg' | relative_url }}" alt="" width="46" height="30">
      <span>Robotic <span class="brand__fire">Audio</span></span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
      {%- if site.shop.open %}
      <a href="{{ site.shop.account_url }}" data-shop="view_account">Account</a>
      <a class="site-nav__cart" href="{{ site.shop.account_url }}" data-shop="view_cart" hidden data-moonbase-if="cart.has_items">Cart <span class="site-nav__count" data-moonbase-render="cart.item_count"></span></a>
      {%- endif %}
    </nav>
  </div>
</header>

<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span>Robotic <span class="brand__fire">Audio</span></span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
      {%- if site.shop.open %}
      <a href="{{ site.shop.account_url }}">Account</a>
      {%- endif %}
    </nav>
  </div>
</header>

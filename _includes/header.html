<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/robot.svg' | relative_url }}" alt="" width="32" height="32">
      <span>Robotic Audio</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>

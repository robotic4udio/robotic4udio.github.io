<footer class="site-footer">
  <div class="container site-footer__inner">
    <div>
      <div class="site-footer__brand">Robotic Audio</div>
      <p>{{ site.tagline }}, by {{ site.author }}.</p>
      <p class="site-footer__looks">Look:
        {%- for look in site.looks %}
        <a href="?look={{ look }}" data-look="{{ look }}">{{ look | capitalize }}</a>{% unless forloop.last %} ·{% endunless %}
        {%- endfor %}
      </p>
      <script>
        document.querySelectorAll(".site-footer__looks a").forEach(function (a) {
          if (a.dataset.look === document.documentElement.dataset.look) a.setAttribute("aria-current", "true");
        });
      </script>
    </div>
    <nav aria-label="Footer">
      <a href="{{ '/plugins/' | relative_url }}">Plugins</a>
      <a href="{{ '/studio/' | relative_url }}">Studio</a>
      <a href="{{ '/hjalte/' | relative_url }}">Portfolio</a>
      <a href="https://tromleorkestret.com">Tromleorkestret</a>
      <a href="mailto:{{ site.email }}">Contact</a>
    </nav>
  </div>
  <div class="site-footer__mark" aria-hidden="true">Robotic <span>Audio</span></div>
  <div class="container site-footer__legal">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</div>
</footer>

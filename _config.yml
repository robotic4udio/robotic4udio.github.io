title: Robotic Audio
tagline: Audio plugins and sound studio
description: Robotic Audio makes audio plugins and builds sound for installations, stages and stories. The studio of Hjalte Bested Hjorth.
author: Hjalte Bested Hjorth
url: "https://roboticaudio.com"
baseurl: ""
email: hjalte.bested.hjorth@gmail.com

# The plugin the homepage leads with (its slug: the file name in _products). Its page can give
# hero_headline (the words before "with <name>") and hero_text; else its title and description.
hero_plugin: bitstorm

# Newsletter: the address a sign-up form posts to (the field is called "email"),
# e.g. https://buttondown.com/api/emails/embed-subscribe/<name>.
# While empty, sign-ups are a "notify me" email link instead of a form.
newsletter_action: ""

# The shop (Moonbase): cart, checkout, downloads and the customer's account, run on every page by
# Moonbase's embedded storefront (_layouts/default.html). Prices, what is on sale and the bundles come
# from Moonbase (_data/shop.json, refreshed by scripts/sync-shop.py); open: false leaves the shop out.
shop:
  open: true
  account_url: "https://roboticaudio.moonbase.sh"
  trial_days: 14

markdown: kramdown
permalink: pretty

collections:
  products:
    output: true
    permalink: /plugins/:name/
    sort_by: order
  # The studio's work (copied from the portfolio), each at /studio/<name>/
  projects:
    output: true
    permalink: /studio/:name/

defaults:
  - scope: { path: "", type: products }
    values: { layout: plugin }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: default }

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
